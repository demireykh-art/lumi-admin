<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<base target="_top">
<title>원내 가격표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* price.html 과 같은 팔레트 · 서체 (functions/index.js 에 있던 _buildPriceHtml 기준) */
:root{--cream:#FAF8F5;--warm:#F3EDE7;--beige:#E8E0D5;--taupe:#C4B7A6;--brown:#8B7355;
  --dark:#1A1A1A;--text:#3D3D3D;--text-light:#6B6B6B;--gold:#C9A962}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#ECE9E4;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-weight:400;
  -webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}

/* ── 툴바 (화면 전용) ── */
.toolbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1rem;
  padding:.6rem 1rem;background:#fff;border-bottom:1px solid var(--beige);font-size:13px}
.toolbar label{display:inline-flex;align-items:center;gap:.3rem;cursor:pointer}
.toolbar .grow{flex:1}
.toolbar .btn{border:1px solid var(--brown);background:#fff;color:var(--brown);padding:.4rem .9rem;border-radius:4px;font:inherit;cursor:pointer}
.toolbar .btn.primary{background:var(--brown);color:#fff}
.status{padding:.45rem 1rem;font-size:12px;color:var(--text-light);background:var(--warm)}
.status b{color:var(--dark);font-weight:500}
.status .warn{color:#a94442;display:block;margin-top:.2rem}

/* ── A4 한 장 = .page 하나. 내용이 넘치면 그 장만 글자를 줄여 맞춘다(fitPages). ── */
.page{width:210mm;height:297mm;margin:16px auto;padding:16mm 16mm 12mm;background:#fff;
  box-shadow:0 2px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden;
  --fs:15pt;font-size:var(--fs);line-height:1.45}
.pg-body{flex:1;min-height:0;overflow:hidden}
.pg-foot{flex:none;margin-top:5mm;padding-top:3mm;border-top:.6pt solid var(--beige);
  display:flex;justify-content:space-between;gap:6mm;font-size:8.5pt;line-height:1.6;color:var(--text-light)}
.pg-foot p{margin:0}
.pg-foot .meta{text-align:right;white-space:nowrap;color:var(--taupe)}
.pg-foot .brand{display:block;font-family:'Cormorant Garamond',serif;font-size:11pt;letter-spacing:.18em;color:var(--brown)}

.cat + .cat{margin-top:1.6em}
.cat h2{margin:0;padding-bottom:.25em;font-family:'Cormorant Garamond','Noto Serif KR',serif;font-weight:600;
  font-size:2.05em;line-height:1.15;color:var(--dark);letter-spacing:.01em;border-bottom:1.2pt solid var(--gold)}
.cat .note{margin:.45em 0 0;font-size:.74em;color:var(--text-light);line-height:1.5}

.grp{padding:.62em 0 .55em;border-bottom:.5pt solid var(--beige);break-inside:avoid;page-break-inside:avoid}
/* 항목이 많은 장(색소·돌출 질환)은 두 단으로 나눠 글자를 크게 유지한다 */
.page.two .items{column-count:2;column-gap:9mm;column-rule:.5pt solid var(--beige)}
.page.two .grp:last-child{border-bottom:.5pt solid var(--beige)}
.grp:last-child{border-bottom:0}
.line{display:flex;align-items:baseline;gap:.45em}
.line .nm{font-weight:600;color:var(--dark)}
.line .sp{color:var(--text-light);font-size:.88em;font-weight:400}
.line .nm .sp{margin-left:.45em;white-space:nowrap}
.line .dots{flex:1;min-width:1.2em;border-bottom:.8pt dotted var(--taupe);transform:translateY(-.28em)}
.line .pr{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--dark);font-weight:500}
.line .pr s{color:var(--taupe);font-size:.78em;margin-right:.45em;font-weight:400}
.line .pr .ev{color:var(--brown);font-weight:600}
.line .pr .ask{color:var(--text-light);font-size:.88em;font-weight:400}
.desc{margin:.12em 0 .1em;font-size:.76em;color:var(--text-light);line-height:1.45}
.opt{padding-left:.9em;margin-top:.18em}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .toolbar,.status{display:none!important}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="toolbar">
  <label><input type="checkbox" id="optStrike" checked> 할인 전 가격 표시</label>
  <span class="grow"></span>
  <button class="btn" id="btnPop" title="인쇄 버튼이 안 먹을 때">새 창에서 열기</button>
  <button class="btn primary" id="btnPrint">🖨 인쇄</button>
</div>
<div class="status" id="status">시트 읽는 중…</div>
<div id="sheet"></div>

<script>
(function(){
  var DATA = null;
  var opt = { strike: true };

  // 한 장에 같이 싣는 카테고리(맥락이 가깝고 내용이 짧은 것끼리).
  // 여기 없는 카테고리는 한 장에 하나씩. 시트에 새 카테고리가 생기면 자동으로 따로 한 장.
  var PAGE_GROUPS = [
    ['여드름 관리', '여드름 레이저 치료'],
    ['스킨부스터', '줄기세포 · 재생'],
    ['주름', '볼륨'],
    ['제모', '케어 · 수액'],
    ['LUMI EVENT', 'VIP PROGRAM'],
  ];

  // 노출 값 → [원내 출력물, 홈페이지]
  var LV = { '둘다':[1,1], '원내만':[1,0], '홈페이지만':[0,1], '숨김':[0,0] };
  function norm(v){
    v = String(v == null ? '' : v).trim();
    if (v === '원내') return '원내만';
    if (v === '홈페이지') return '홈페이지만';
    return v;
  }
  // 우선순위: 더 좁은 쪽이 이긴다(교집합).
  //   줄 노출이 비어 있으면 카테고리 값을 그대로 따르고,
  //   채워져 있으면 카테고리 ∩ 줄. → 카테고리가 '둘다'여도 줄 '숨김'이면 숨김,
  //   카테고리가 '숨김'이면 줄에 뭐라고 써도 숨김.
  function visible(catV, rowV, warns, where){
    var c = norm(catV) || '둘다', r = norm(rowV);
    if (!LV[c]) { warns.push(where + ' 카테고리 노출 값 "' + c + '" 를 몰라서 숨김 처리'); c = '숨김'; }
    if (r && !LV[r]) { warns.push(where + ' 노출 값 "' + r + '" 를 몰라서 숨김 처리'); r = '숨김'; }
    var cl = LV[c], rl = r ? LV[r] : cl;
    return [cl[0] & rl[0], cl[1] & rl[1]];
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function won(v){
    if (v === '' || v == null) return '';
    if (typeof v === 'number') return v.toLocaleString('ko-KR') + '원';
    var s = String(v).trim();
    if (/^[\d,]+$/.test(s)) return Number(s.replace(/,/g, '')).toLocaleString('ko-KR') + '원';
    return s;   // 이미 "1,800,000원" 처럼 글자로 들어 있는 경우
  }
  function col(header, name, fallback){
    var i = header.map(function(h){ return String(h).trim(); }).indexOf(name);
    return i >= 0 ? i : fallback;
  }

  function build(){
    var warns = [], fees = DATA.fees || [], cats = DATA.cats || [], foot = DATA.foot || [];
    var fh = fees[0] || [];
    var C = { cat:col(fh,'카테고리',0), name:col(fh,'시술명',1), desc:col(fh,'설명',2), spec:col(fh,'범위',3),
              price:col(fh,'가격',4), disp:col(fh,'가격 표시(선택)',5), was:col(fh,'할인 전 가격',6), show:col(fh,'노출',7) };
    var ch = cats[0] || [];
    var K = { name:col(ch,'카테고리',0), note:col(ch,'카테고리 설명',1), show:col(ch,'노출',2) };

    var catOrder = [], catInfo = {};
    cats.slice(1).forEach(function(r){
      var n = String(r[K.name] || '').trim(); if (!n || catInfo[n]) return;
      catOrder.push(n); catInfo[n] = { note: String(r[K.note] || '').trim(), show: r[K.show] };
    });

    // 시트 순서대로, 같은 카테고리·같은 시술명이 붙어 있으면 한 묶음
    var groups = {}, shown = 0, hidden = 0;
    var last = null;
    fees.slice(1).forEach(function(r, i){
      var cat = String(r[C.cat] || '').trim(), name = String(r[C.name] || '').trim();
      if (!cat && !name) return;
      var where = (i + 2) + '행(' + (name || '이름 없음') + ')';
      if (!catInfo[cat]) {
        warns.push(where + ' 카테고리 "' + cat + '" 가 카테고리 탭에 없음 — 맨 뒤에 붙임');
        catOrder.push(cat); catInfo[cat] = { note: '', show: '둘다' };
      }
      var g;
      if (last && last.cat === cat && last.name === name) g = last;
      else {
        g = { cat: cat, name: name, desc: '', rows: [], opts: [] };
        (groups[cat] = groups[cat] || []).push(g); last = g;
      }
      g.rows.push(String(r[C.desc] || '').trim());   // 숨긴 줄 설명도 묶음 설명 판정엔 쓴다
      if (!visible(catInfo[cat].show, r[C.show], warns, where)[0]) { hidden++; return; }
      shown++;
      g.opts.push({
        spec: String(r[C.spec] || '').trim(),
        d: String(r[C.desc] || '').trim(),
        disp: String(r[C.disp] || '').trim(),
        price: won(r[C.price]),
        was: won(r[C.was]),
      });
    });

    // 설명: 묶음 안 설명이 한 가지뿐이면 시술명 밑에 한 번(작성 규칙 3),
    // 줄마다 다르면(여성 제모: 겨드랑이/인중/…) 각 줄의 범위 옆에 붙인다.
    Object.keys(groups).forEach(function(cat){ groups[cat].forEach(function(g){
      var all = g.rows.filter(Boolean), uniq = all.filter(function(v, i){ return all.indexOf(v) === i; });
      if (uniq.length > 1) { g.desc = ''; g.opts.forEach(function(o){ o.extra = o.d; }); }
      else g.desc = uniq[0] || '';
    }); });

    function priceHtml(o){
      if (o.disp) return esc(o.disp);
      if (!o.price) return '<span class="ask">상담 후 안내</span>';
      if (opt.strike && o.was && o.was !== o.price) return '<s>' + esc(o.was) + '</s><span class="ev">' + esc(o.price) + '</span>';
      return esc(o.price);
    }
    function specText(o){ return [o.spec, o.extra].filter(Boolean).join(' · '); }

    function grpHtml(g){
      var o = g.opts;
      if (o.length === 1) {
        var sp = specText(o[0]);
        return '<div class="grp"><div class="line"><span class="nm">' + esc(g.name)
          + (sp ? '<span class="sp">' + esc(sp) + '</span>' : '') + '</span><span class="dots"></span>'
          + '<span class="pr">' + priceHtml(o[0]) + '</span></div>'
          + (g.desc ? '<div class="desc">' + esc(g.desc) + '</div>' : '') + '</div>';
      }
      return '<div class="grp"><div class="line"><span class="nm">' + esc(g.name) + '</span></div>'
        + (g.desc ? '<div class="desc">' + esc(g.desc) + '</div>' : '')
        + o.map(function(x){
            return '<div class="line opt"><span class="sp">' + esc(specText(x) || '1회') + '</span><span class="dots"></span>'
              + '<span class="pr">' + priceHtml(x) + '</span></div>';
          }).join('') + '</div>';
    }
    function catHtml(cat){
      var gs = (groups[cat] || []).filter(function(g){ return g.opts.length; });
      if (!gs.length) return '';
      var info = catInfo[cat];
      return '<section class="cat"><h2>' + esc(cat) + '</h2>'
        + (info.note ? '<p class="note">' + esc(info.note) + '</p>' : '')
        + '<div class="items">' + gs.map(grpHtml).join('') + '</div></section>';
    }

    // 장 나누기: 카테고리 탭 순서대로 가되, PAGE_GROUPS 에 묶인 것은 첫 카테고리 자리에 함께 싣는다.
    var used = {}, pages = [];
    catOrder.forEach(function(cat){
      if (used[cat]) return;
      var grp = PAGE_GROUPS.filter(function(gr){ return gr.indexOf(cat) >= 0; })[0] || [cat];
      var html = grp.map(function(c){ used[c] = 1; return catInfo[c] ? catHtml(c) : ''; }).join('');
      if (html) pages.push(html);
    });

    var fhh = foot[0] || [];
    var F = { text: col(fhh,'문구',0), show: col(fhh,'노출',1) };
    var notes = foot.slice(1).filter(function(r){
      var v = norm(r[F.show]) || '둘다';
      if (!LV[v]) { warns.push('하단 문구 노출 값 "' + v + '" 를 몰라서 숨김 처리'); return false; }
      return String(r[F.text] || '').trim() && LV[v][0];
    }).map(function(r){ return '<p>' + esc(r[F.text]) + '</p>'; }).join('');

    var footHtml = '<footer class="pg-foot"><div>' + notes + '</div>'
      + '<div class="meta"><span class="brand">THE CLINIC LUMI</span>기준일 ' + esc(DATA.today || '') + '</div></footer>';
    document.getElementById('sheet').innerHTML = pages.map(function(h){
      return '<section class="page"><div class="pg-body">' + h + '</div>' + footHtml + '</section>';
    }).join('');

    document.getElementById('status').innerHTML = 'A4 <b>' + pages.length + '장</b> · 출력 ' + shown + '줄 · 노출 설정으로 빠진 줄 ' + hidden
      + (warns.length ? warns.map(function(w){ return '<span class="warn">⚠ ' + esc(w) + '</span>'; }).join('') : '');
    fitPages();
  }

  // 장마다 18pt 에서 시작해 넘치면 0.5pt 씩 줄인다. 한 단으로 13pt 아래로 내려가야 하면
  // 두 단으로 바꿔 16pt 부터 다시 맞춘다(최소 10pt). 글꼴이 다 받아진 뒤에 한 번 더 돈다.
  function fitPages(){
    Array.prototype.forEach.call(document.querySelectorAll('.page'), function(pg){
      var body = pg.querySelector('.pg-body');
      function over(){ return body.scrollHeight > body.clientHeight + 1; }
      function fit(start, min){
        var fs = start; pg.style.setProperty('--fs', fs + 'pt');
        while (over() && fs > min) { fs -= 0.5; pg.style.setProperty('--fs', fs + 'pt'); }
        return fs;
      }
      pg.classList.remove('two');
      var fs = fit(18, 13);
      if (over()) { pg.classList.add('two'); fs = fit(16, 10); }
      pg.dataset.fs = fs + (pg.classList.contains('two') ? ' (2단)' : '');
    });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (DATA) fitPages(); });

  document.getElementById('optStrike').addEventListener('change', function(){ opt.strike = this.checked; if (DATA) build(); });
  document.getElementById('btnPrint').addEventListener('click', function(){ window.print(); });
  document.getElementById('btnPop').addEventListener('click', function(){
    var w = window.open('', '_blank');
    if (!w) { alert('팝업이 막혔어요. 브라우저 주소창 오른쪽에서 팝업을 허용해 주세요.'); return; }
    w.document.write('<!DOCTYPE html><html lang="ko"><head>' + document.head.innerHTML
      + '</head><body>' + document.getElementById('sheet').innerHTML + '</body></html>');
    w.document.close();
    setTimeout(function(){ w.focus(); w.print(); }, 900);
  });

  function load(d){ DATA = d; build(); }
  if (window.__PREVIEW_DATA__) load(window.__PREVIEW_DATA__);
  else google.script.run
    .withSuccessHandler(load)
    .withFailureHandler(function(e){ document.getElementById('status').textContent = '시트를 못 읽었어요: ' + (e && e.message || e); })
    .getPrintData();
})();
</script>
</body>
</html>
