name: Deploy Cloud Functions

# functions/ 아래가 main 에 푸시되면 Cloud Functions 를 자동 배포.
# GitHub 모바일 앱에서 Actions 탭 → "Run workflow" 로 수동 실행도 가능.
# 사전 준비(1회):
#   1) 레포 Settings → Secrets and variables → Actions 에
#      FIREBASE_SERVICE_ACCOUNT = (Firebase 서비스 계정 JSON 키 전체) 등록
#      ※ firestore.rules 배포 워크플로우와 같은 시크릿을 씁니다.
#   2) ocrReceipt 함수는 Cloud Vision API 를 호출하므로 GCP 콘솔에서
#      lumiclinic-c1a95 프로젝트에 Cloud Vision API 를 활성화해야 합니다.

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
  workflow_dispatch:      # 모바일/웹에서 수동 실행 버튼
    inputs:
      only:
        description: '특정 함수만 배포 (예: ocrReceipt). 비우면 전체 배포.'
        required: false
        default: ''

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # functions/package.json engines 와 맞춰야 함

      # 런타임 버전이 firebase.json·package.json·이 워크플로우 세 군데에 적혀 있다.
      # 하나만 올리고 나머지를 잊으면 배포는 성공하는데 엉뚱한 버전으로 뜬다.
      - name: Check Node runtime pins agree
        run: |
          RUNTIME=$(node -p "require('./firebase.json').functions[0].runtime")   # nodejs22
          ENGINE=$(node -p "require('./functions/package.json').engines.node")   # 22
          ACTUAL=$(node -p "process.versions.node.split('.')[0]")                # 22
          echo "firebase.json=$RUNTIME  package.json=$ENGINE  runner=$ACTUAL"
          if [ "$RUNTIME" != "nodejs$ENGINE" ] || [ "$ENGINE" != "$ACTUAL" ]; then
            echo "::error::Node 버전이 어긋납니다. firebase.json(runtime)·functions/package.json(engines)·워크플로우(setup-node)를 같은 버전으로 맞춰주세요."
            exit 1
          fi

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Syntax check
        working-directory: functions
        run: node --check index.js

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_KEY" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT 시크릿이 설정되지 않았습니다. 레포 Settings → Secrets 에서 등록해주세요."
            exit 1
          fi
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"

      # 스케줄러·Eventarc 를 쓰는 함수가 하나라도 있으면 배포 전에 프로젝트 IAM
      # 정책 수정이 필요하다. 그 권한이 없으면 "We failed to modify the IAM policy"
      # 로 전체 배포가 멈춘다. 그럴 때 only 에 함수 이름을 넣어 급한 것만 먼저
      # 올릴 수 있다. (예: ocrReceipt — 스케줄러를 쓰지 않아 IAM 수정이 불필요)
      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            TARGET="functions:$ONLY"
            echo "::notice::선택 배포 — $TARGET"
          else
            TARGET="functions"
          fi
          firebase deploy --only "$TARGET" \
            --project lumiclinic-c1a95 \
            --non-interactive

      # 배포할 때마다 함수 컨테이너 이미지가 Artifact Registry 에 쌓인다.
      # 이 저장 용량이 이 프로젝트에서 사실상 유일한 고정 지출이라, 오래된
      # 이미지를 자동 삭제하도록 정리 정책을 걸어 둔다(멱등, 매번 실행해도 무방).
      - name: Set artifact cleanup policy
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        continue-on-error: true      # 정책 설정 실패가 배포 결과를 뒤집지 않게
        run: |
          firebase functions:artifacts:setpolicy \
            --project lumiclinic-c1a95 \
            --location asia-northeast3 \
            --days 1 --force --non-interactive

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
