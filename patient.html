<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>루미의원 시술 안내</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!--
  환자용 앱 (Phase 1 — 메뉴 열람 전용)
  · 로그인 없음 · 개인정보 입력 없음 · 결제 없음 (수납은 데스크)
  · Firestore 에 직접 접근하지 않는다. 공개 메뉴는 Cloud Function getPatientMenu 로만 읽는다.
  · 메뉴 원천: 통합앱(staff.html) 수가표 → [📱 환자앱 메뉴] 에서 발행한 patientMenu/current
  · 가격 정책: 표시가는 부가세 10% 별도 (시술가 / 부가세 / 합계를 함께 표기)
  기획: docs/patient-app-qr-order.md
-->
<style>
    :root{
        --fs:1;
        --bg:#f7f6f4; --card:#fff; --line:#e8e6e2;
        --text:#26231f; --muted:#8a857d; --accent:#7c6a53; --accent-bg:#f3efe8;
        --price:#1f2937;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0}
    body{
        font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
        background:var(--bg); color:var(--text);
        font-size:calc(16px * var(--fs));
        line-height:1.55; -webkit-text-size-adjust:100%;
        padding-bottom:calc(env(safe-area-inset-bottom) + 3.5rem);
    }
    .wrap{max-width:560px;margin:0 auto}

    /* ── 헤더 ── */
    header{
        position:sticky;top:0;z-index:30;background:var(--card);
        border-bottom:1px solid var(--line);
        padding:calc(env(safe-area-inset-top) + .75rem) 1rem .6rem;
    }
    .hd-row{display:flex;align-items:center;gap:.6rem;max-width:560px;margin:0 auto}
    .logo{font-size:1.08em;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0}
    .logo small{display:block;font-size:.68em;font-weight:400;color:var(--muted);letter-spacing:0}
    .fsbtn{
        flex-shrink:0;background:var(--accent-bg);border:1px solid var(--line);color:var(--accent);
        border-radius:999px;padding:.35rem .7rem;font-size:.74em;font-weight:600;cursor:pointer;
        font-family:inherit;white-space:nowrap;
    }
    .vat-bar{
        background:var(--accent-bg);color:var(--accent);
        font-size:.72em;text-align:center;padding:.4rem 1rem;border-bottom:1px solid var(--line);
    }
    .notice{
        background:#fffbeb;color:#92400e;border-bottom:1px solid #fde68a;
        font-size:.74em;padding:.55rem 1rem;line-height:1.5;
    }

    /* ── 탭 ── */
    .tabs{display:flex;gap:.4rem;padding:.65rem 1rem .5rem;max-width:560px;margin:0 auto}
    .tab{
        flex:1;padding:.6rem .4rem;border-radius:999px;border:1px solid var(--line);
        background:var(--card);color:var(--muted);font-size:.82em;font-weight:600;
        cursor:pointer;font-family:inherit;transition:.15s;
    }
    .tab.on{background:var(--text);border-color:var(--text);color:#fff}

    .search-wrap{padding:0 1rem .6rem;max-width:560px;margin:0 auto}
    .search{
        width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:10px;
        font-size:.85em;font-family:inherit;background:var(--card);color:var(--text);
    }
    .search::placeholder{color:#b9b4ab}

    main{padding:0 1rem 2rem;max-width:560px;margin:0 auto}

    /* ── 카드 ── */
    .cat{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:.6rem;overflow:hidden}
    .cat-hd{
        display:flex;align-items:center;gap:.5rem;width:100%;
        padding:.85rem .95rem;background:none;border:none;cursor:pointer;
        font-family:inherit;text-align:left;color:var(--text);
    }
    .cat-hd b{flex:1;min-width:0;font-size:.92em;font-weight:600;word-break:break-word}
    .cat-hd .cnt{font-size:.72em;color:var(--muted);flex-shrink:0}
    .cat-hd .arw{color:var(--muted);font-size:.8em;flex-shrink:0}
    .cat-grp{font-size:.68em;color:var(--muted);font-weight:400;display:block;margin-bottom:.1rem}

    .item{padding:.8rem .95rem;border-top:1px solid var(--line);cursor:pointer}
    .item-top{display:flex;align-items:flex-start;gap:.6rem}
    .item-nm{flex:1;min-width:0;font-size:.86em;word-break:break-word;line-height:1.45}
    .item-pr{flex-shrink:0;text-align:right;font-size:.86em;font-weight:600;color:var(--price);white-space:nowrap}
    .item-pr small{display:block;font-size:.68em;font-weight:400;color:var(--muted)}
    .chips{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.3rem}
    .chip{font-size:.66em;background:var(--accent-bg);color:var(--accent);border-radius:999px;padding:.1rem .5rem}
    .chip.gray{background:#f1f0ed;color:var(--muted)}

    .detail{margin-top:.65rem;padding:.7rem .8rem;background:#faf9f7;border:1px solid var(--line);border-radius:9px}
    .drow{display:flex;justify-content:space-between;font-size:.78em;padding:.16rem 0;color:var(--muted)}
    .drow.total{border-top:1px dashed var(--line);margin-top:.3rem;padding-top:.4rem;color:var(--text);font-weight:700}
    .dnote{font-size:.7em;color:var(--muted);margin-top:.5rem;line-height:1.5}

    /* ── 고민별 ── */
    .crumb{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem;font-size:.76em;color:var(--muted)}
    .crumb button{background:none;border:none;color:var(--accent);font-family:inherit;font-size:1em;cursor:pointer;padding:0;text-decoration:underline}
    .node{
        display:flex;align-items:center;gap:.6rem;width:100%;
        background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:.95rem;margin-bottom:.5rem;cursor:pointer;font-family:inherit;text-align:left;color:var(--text);
    }
    .node b{flex:1;min-width:0;font-size:.9em;font-weight:600;word-break:break-word}
    .node .arw{color:var(--muted);flex-shrink:0}

    .msg{text-align:center;color:var(--muted);font-size:.85em;padding:3rem 1rem;line-height:1.7}
    .btn{
        display:inline-block;margin-top:.9rem;background:var(--text);color:#fff;border:none;
        border-radius:999px;padding:.6rem 1.4rem;font-size:.85em;font-family:inherit;cursor:pointer;font-weight:600;
    }
    footer{
        text-align:center;font-size:.68em;color:var(--muted);
        padding:1.5rem 1rem calc(env(safe-area-inset-bottom) + 1.5rem);line-height:1.7;
    }
    .fixed-note{
        position:fixed;left:0;right:0;bottom:0;z-index:25;
        background:rgba(255,255,255,.96);backdrop-filter:blur(6px);
        border-top:1px solid var(--line);
        padding:.7rem 1rem calc(env(safe-area-inset-bottom) + .7rem);
        text-align:center;font-size:.74em;color:var(--muted);
    }
</style>
</head>
<body>
<header>
    <div class="hd-row">
        <div class="logo" id="clinicName">루미의원<small id="hdSub">시술 안내</small></div>
        <button class="fsbtn" id="fsBtn" onclick="toggleFont()">가 크게</button>
    </div>
</header>
<div class="vat-bar">표시 금액은 <b>부가세(10%) 별도</b> 입니다</div>
<div class="notice" id="noticeBar" style="display:none"></div>

<div class="wrap">
    <div class="tabs" id="tabs" style="display:none">
        <button class="tab" id="tabConcern" onclick="setView('concern')">고민별로 찾기</button>
        <button class="tab" id="tabCat" onclick="setView('cat')">시술별로 보기</button>
    </div>
    <div class="search-wrap" id="searchWrap" style="display:none">
        <input class="search" id="q" type="search" placeholder="시술 이름으로 검색" oninput="render()">
    </div>
</div>

<main id="main"><div class="msg">메뉴를 불러오는 중입니다…</div></main>

<footer id="foot" style="display:none">
    표시된 금액은 안내용이며, 진료 후 부위·범위·상태에 따라 달라질 수 있습니다.<br>
    정확한 금액과 시술 여부는 <b>의료진 상담 후</b> 결정됩니다.
    <div id="verLine" style="margin-top:.5rem;opacity:.7"></div>
</footer>

<div class="fixed-note" id="fixedNote" style="display:none">
    마음에 드는 시술은 <b>상담 때 말씀해 주세요</b>
</div>

<script>
const API='https://asia-northeast3-lumiclinic-c1a95.cloudfunctions.net/getPatientMenu';
const VAT=0.1;

let MENU=null;
let view='cat';           // 'cat' | 'concern'
let openCat=null;         // 펼친 카테고리 id
let openItem=null;        // 펼친 시술 procId
let path=[];              // 고민별 탐색 경로 (index 배열)

/* ── 유틸 ── */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>'₩'+(Number(n)||0).toLocaleString('ko-KR');

function toggleFont(){
    const big=document.documentElement.style.getPropertyValue('--fs')==='1.18';
    setFont(!big);
    try{ localStorage.setItem('lumi_patient_bigfont', big?'0':'1'); }catch(_){}
}
function setFont(big){
    document.documentElement.style.setProperty('--fs', big?'1.18':'1');
    const b=document.getElementById('fsBtn');
    if(b) b.textContent=big?'가 작게':'가 크게';
}
try{ if(localStorage.getItem('lumi_patient_bigfont')==='1') setFont(true); }catch(_){}

/* ── 로드 ── */
async function load(){
    try{
        const r=await fetch(API,{cache:'no-store'});
        if(r.status===404){ showMsg('메뉴를 준비 중입니다.<br>잠시 후 다시 확인해 주세요.'); return; }
        if(!r.ok) throw new Error('HTTP '+r.status);
        MENU=await r.json();
        boot();
    }catch(e){
        console.warn('메뉴 로드 실패',e);
        showMsg('메뉴를 불러오지 못했습니다.<br>네트워크 상태를 확인해 주세요.'
            +'<br><button class="btn" onclick="location.reload()">다시 시도</button>');
    }
}
function showMsg(html){ document.getElementById('main').innerHTML='<div class="msg">'+html+'</div>'; }

function boot(){
    document.getElementById('clinicName').innerHTML=
        esc(MENU.clinicName||'루미의원')+'<small>시술 안내</small>';
    document.title=(MENU.clinicName||'루미의원')+' 시술 안내';
    if(MENU.notice){
        const n=document.getElementById('noticeBar');
        n.textContent=MENU.notice; n.style.display='block';
    }
    const hasConcern=!!(MENU.byConcern&&Array.isArray(MENU.byConcern.roots)&&MENU.byConcern.roots.length);
    document.getElementById('tabConcern').style.display=hasConcern?'':'none';
    document.getElementById('tabs').style.display=hasConcern?'flex':'none';
    document.getElementById('searchWrap').style.display='block';
    document.getElementById('foot').style.display='block';
    document.getElementById('fixedNote').style.display='block';
    if(MENU.publishedAt){
        const d=new Date(MENU.publishedAt);
        document.getElementById('verLine').textContent=
            '기준일 '+d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
    }
    view=hasConcern?'concern':'cat';
    syncTabs();
    render();
}
function setView(v){ view=v; path=[]; openItem=null; syncTabs(); render(); window.scrollTo(0,0); }
function syncTabs(){
    document.getElementById('tabConcern').classList.toggle('on',view==='concern');
    document.getElementById('tabCat').classList.toggle('on',view==='cat');
}

/* ── 가격 표시 (부가세 별도) ── */
function priceCell(it){
    if(it.unitPriced){
        const u=Number(it.unitPriceKRW)||0;
        return `${won(u)}<small>/${esc(it.unit||'단위')} · VAT 별도</small>`;
    }
    const p=Number(it.priceKRW)||0;
    if(!p) return `<small>상담 시 안내</small>`;
    return `${won(p)}<small>+VAT ${won(Math.round(p*VAT))}</small>`;
}
function priceDetail(it){
    if(it.unitPriced){
        const u=Number(it.unitPriceKRW)||0, v=Math.round(u*VAT);
        return `<div class="drow"><span>${esc(it.unit||'단위')} 1개당</span><span>${won(u)}</span></div>
            <div class="drow"><span>부가세 10%</span><span>${won(v)}</span></div>
            <div class="drow total"><span>${esc(it.unit||'단위')} 1개당 합계</span><span>${won(u+v)}</span></div>
            <div class="dnote">최종 금액은 시술 수량에 따라 결정됩니다.</div>`;
    }
    const p=Number(it.priceKRW)||0;
    if(!p) return `<div class="dnote">가격은 상담 시 안내해 드립니다.</div>`;
    const v=Math.round(p*VAT);
    const per=(it.sessions>1)?`<div class="drow"><span>1회당</span><span>${won(Math.round((p+v)/it.sessions))}</span></div>`:'';
    return `<div class="drow"><span>시술 금액</span><span>${won(p)}</span></div>
        <div class="drow"><span>부가세 10%</span><span>${won(v)}</span></div>
        <div class="drow total"><span>결제 예상 금액</span><span>${won(p+v)}</span></div>
        ${per}
        <div class="dnote">진료 후 부위·범위에 따라 달라질 수 있습니다. 수납은 데스크에서 도와드립니다.</div>`;
}

/* ── 렌더 ── */
function render(){
    const q=(document.getElementById('q')?.value||'').toLowerCase().trim();
    if(q){ renderSearch(q); return; }
    if(view==='concern') renderConcern(); else renderCat();
}

function itemHtml(it){
    const open=(openItem===it.procId);
    const chips=[];
    if(it.sessions>1) chips.push(`<span class="chip">${it.sessions}회</span>`);
    if(it.durationMin) chips.push(`<span class="chip gray">약 ${it.durationMin}분</span>`);
    (it.tags||[]).forEach(t=>chips.push(`<span class="chip">${esc(t)}</span>`));
    return `<div class="item" onclick="tapItem('${esc(it.procId)}')">
        <div class="item-top">
            <div class="item-nm">${esc(it.name)}</div>
            <div class="item-pr">${priceCell(it)}</div>
        </div>
        ${chips.length?`<div class="chips">${chips.join('')}</div>`:''}
        ${open?`<div class="detail">${priceDetail(it)}</div>`:''}
    </div>`;
}
function tapItem(id){ openItem=(openItem===id)?null:id; render(); }

function renderCat(){
    const cats=MENU.byCategory||[];
    if(!cats.length){ showMsg('안내 중인 시술이 없습니다.'); return; }
    document.getElementById('main').innerHTML=cats.map(c=>{
        const on=(openCat===c.id);
        return `<div class="cat">
            <button class="cat-hd" onclick="tapCat('${esc(c.id)}')">
                <b>${c.group?`<span class="cat-grp">${esc(c.group)}</span>`:''}${esc(c.name)}</b>
                <span class="cnt">${c.items.length}</span>
                <span class="arw">${on?'▲':'▼'}</span>
            </button>
            ${on?c.items.map(itemHtml).join(''):''}
        </div>`;
    }).join('');
}
function tapCat(id){ openCat=(openCat===id)?null:id; openItem=null; render(); }

function renderSearch(q){
    const hits=[];
    (MENU.byCategory||[]).forEach(c=>c.items.forEach(it=>{
        if((c.name+' '+it.name).toLowerCase().includes(q)) hits.push(it);
    }));
    document.getElementById('main').innerHTML=hits.length
        ? `<div class="cat">${hits.map(itemHtml).join('')}</div>`
        : '<div class="msg">검색 결과가 없습니다.<br>상담 때 편하게 물어봐 주세요.</div>';
}

function nodeAt(p){
    let list=(MENU.byConcern&&MENU.byConcern.roots)||[];
    let node=null;
    for(const i of p){ node=list[i]; if(!node) return null; list=node.children||[]; }
    return node;
}
function renderConcern(){
    const cur=path.length?nodeAt(path):null;
    const list=cur?(cur.children||[]):((MENU.byConcern&&MENU.byConcern.roots)||[]);
    const items=cur?(cur.items||[]):[];
    let html='';
    if(path.length){
        const names=[];
        for(let i=1;i<=path.length;i++){ const n=nodeAt(path.slice(0,i)); if(n) names.push(n.name); }
        html+=`<div class="crumb"><button onclick="goUp()">← 뒤로</button>`
            +`<span>${names.map(esc).join(' › ')}</span></div>`;
    }else{
        html+=`<div class="crumb"><span>어떤 점이 고민이신가요?</span></div>`;
    }
    if(items.length){
        html+=`<div class="cat">${items.map(concernItemHtml).join('')}</div>`;
    }
    html+=list.map((n,i)=>`<button class="node" onclick="goDown(${i})">
        <b>${esc(n.name)}</b><span class="arw">›</span></button>`).join('');
    if(!list.length&&!items.length) html+='<div class="msg">준비 중입니다.</div>';
    document.getElementById('main').innerHTML=html;
}
function concernItemHtml(it){
    const id='c_'+esc(it.label);
    const open=(openItem===id);
    const pr=it.consultOnly?'<small>상담 시 안내</small>'
        :`${won(it.priceKRW)}<small>+VAT ${won(Math.round((Number(it.priceKRW)||0)*VAT))}</small>`;
    return `<div class="item" onclick="tapItem('${id}')">
        <div class="item-top">
            <div class="item-nm">${esc(it.label)}</div>
            <div class="item-pr">${pr}</div>
        </div>
        ${open?`<div class="detail">${it.consultOnly
            ? '<div class="dnote">부위·범위에 따라 금액이 달라져 상담 시 안내해 드립니다.</div>'
            : priceDetail({priceKRW:it.priceKRW})}</div>`:''}
    </div>`;
}
function goDown(i){ path.push(i); openItem=null; render(); window.scrollTo(0,0); }
function goUp(){ path.pop(); openItem=null; render(); window.scrollTo(0,0); }

load();
</script>
</body>
</html>
